# params_hyperion.yml — overlay for --technology hyperion (Standard BioTools Hyperion IMC)
# Upstream preset ../assets/predefined/hyperion_base.config (Cellpose on the DNA1 channel).
patch_width_pixel: 3000
patch_overlap_pixel: 40
use_cellpose: true
cellpose_diameter: 8
cellpose_channels: DNA1
flow_threshold: 2
cellprob_threshold: -6
min_area_pixels2: 16
min_intensity_ratio: 0.1
aggregate_channels: true
# quoted: the pinned schema types expand_radius_ratio as a string (the preset writes 0.1)
expand_radius_ratio: '0.1'
pixel_size: 1
